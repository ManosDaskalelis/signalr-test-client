<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr/dist/browser/signalr.min.js"></script>
    <script src="./app.js" defer></script>
    <title>Chat Tester</title>
  </head>
  <body>

    <!-- Connection Panel -->
    <div class="panel" id="connectionPanel">
      <h2>🔌 Connection</h2>
      <div class="field">
        <label for="urlInput">SignalR Hub URL</label>
        <input
          type="text"
          id="urlInput"
          name="hubUrl"
          value="https://localhost:7274/hubs/chat"
          placeholder="Enter SignalR Hub URL"
        />
      </div>
      <div class="btn-group">
        <button type="button" id="connectButton">Connect</button>
        <button type="button" id="disconnectButton" disabled>Disconnect</button>
      </div>
      <div id="connectionStatus" class="status-indicator">
        <span class="status-dot disconnected"></span>
        <span class="status-text">Disconnected</span>
      </div>
    </div>

    <!-- Chat Interface (disabled until connected) -->
    <div id="chatInterface" class="disabled-overlay">

      <!-- Room -->
      <div class="panel">
        <h2>Room</h2>
        <div class="field">
          <label for="roomIdInput">Room ID</label>
          <input type="text" id="roomIdInput" name="roomId" value="c2332bbe-6ff1-4c55-b93c-612b7ea3dd8b" />
        </div>
        <div class="field">
          <label for="newRoomNameInput">New Room Name</label>
          <input type="text" id="newRoomNameInput" name="newRoomName" value="" />
        </div>
        <div class="field">
          <label for="roomTypeInput">Room Type</label>
          <input type="text" id="roomTypeInput" name="roomType" value="" />
        </div>
        <div class="btn-group">
          <button type="button" id="createRoomButton">Create Room</button>
          <button type="button" id="joinHubButton">Join SignalR Hub</button>
          <button type="button" id="leaveHubButton">Leave SignalR Hub</button>
          <button type="button" id="joinRoomButton">Join Room</button>
          <button type="button" id="leaveRoomButton">Leave Room</button>
          <button type="button" id="getMessagesButton">Get Messages</button>
        </div>
      </div>

      <!-- Room Management -->
      <div class="panel">
        <h2>Room Management</h2>
        <div class="field">
          <label for="memberUserIdInput">User ID</label>
          <input type="text" id="memberUserIdInput" name="memberUserId" value="" />
        </div>
        <div class="field">
          <label for="memberRoleInput">Role</label>
          <input type="text" id="memberRoleInput" name="memberRole" value="" />
        </div>
        <div class="field">
          <label for="roomNameInput">Room Name</label>
          <input type="text" id="roomNameInput" name="roomName" value="" />
        </div>
        <div class="btn-group">
          <button type="button" id="removeMemberButton">Remove Member</button>
          <button type="button" id="changeMemberRoleButton">Change Member Role</button>
          <button type="button" id="renameRoomButton">Rename Room</button>
          <button type="button" id="deleteRoomButton">Delete Room</button>
        </div>
      </div>

      <!-- Send Message -->
      <div class="panel">
        <h2>Send Message</h2>
        <div class="field">
          <label for="sendRoomIdInput">Room ID</label>
          <input type="text" id="sendRoomIdInput" name="sendRoomId" value="" />
        </div>
        <div class="field">
          <label for="sendMsgContentInput">Content</label>
          <input type="text" id="sendMsgContentInput" name="sendMsgContent" value="" />
        </div>
        <div class="btn-group">
          <button type="button" id="sendMessageButton">Send Message</button>
        </div>
      </div>

      <!-- Edit / Delete Message -->
      <div class="panel">
        <h2>Edit / Delete Message</h2>
        <div class="field">
          <label for="editMsgIdInput">Message ID (Edit)</label>
          <input type="text" id="editMsgIdInput" name="editMsgId" value="" />
        </div>
        <div class="field">
          <label for="editMsgContentInput">New Content</label>
          <input type="text" id="editMsgContentInput" name="editMsgContent" value="" />
        </div>
        <div class="btn-group">
          <button type="button" id="editMessageButton">Edit Message</button>
        </div>
        <div class="field" style="margin-top:12px">
          <label for="deleteMsgIdInput">Message ID (Delete)</label>
          <input type="text" id="deleteMsgIdInput" name="deleteMsgId" value="" />
        </div>
        <div class="btn-group">
          <button type="button" id="deleteMessageButton">Delete Message</button>
        </div>
      </div>

      <!-- Reactions -->
      <div class="panel">
        <h2>Reactions</h2>
        <div class="field">
          <label for="reactionMsgIdInput">Message ID</label>
          <input type="text" id="reactionMsgIdInput" name="reactionMsgId" value="" />
        </div>
        <div class="field">
          <label for="reactionEmojiInput">Emoji</label>
          <input type="text" id="reactionEmojiInput" name="reactionEmoji" value="😢" />
        </div>
        <div class="btn-group">
          <button type="button" id="addReaction">Add Reaction</button>
          <button type="button" id="removeReaction">Remove Reaction</button>
        </div>
      </div>

      <!-- Typing Indicator (auto-triggered while typing in Send Message) -->
      <div class="panel">
        <h2>Typing Indicator</h2>
        <p class="panel-hint">Ενεργοποιείται αυτόματα όταν πληκτρολογείς στο Send Message content field.</p>
        <div id="typingStatus" class="typing-status hidden"></div>
      </div>

      <!-- Event Log -->
      <div class="panel">
        <h2>Event Log</h2>
        <div class="event-log-toolbar">
          <button type="button" id="clearLogButton" class="btn-clear">Clear</button>
        </div>
        <ul id="eventLog"></ul>
      </div>

    </div>

  </body>
</html>
